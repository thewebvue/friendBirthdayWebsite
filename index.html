<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: white; 
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden; 
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .gif-container {
            height: 250px; 
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        img {
            max-height: 100%;
            max-width: 300px;
            object-fit: contain;
        }

        h1 {
            color: #333;
            margin: 10px 0;
            font-size: 1.8rem;
            font-weight: normal;
        }

        .buttons {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 10px 25px;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yes-btn {
            background-color: #2bd853; 
            font-weight: bold;
        }

        #no-btn {
            background-color: #dc3545; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <!-- Fetching the exact Ask GIF via an unblocked API proxy -->
            <img id="main-gif" src="https://api.codetabs.com/v1/proxy?quest=https://media.tenor.com/sw02F_L-sXEAAAAi/milk-and-mocha-bears-milk-and-mocha.gif" alt="Milk and Mocha Bear">
        </div>
        
        <h1 id="question">Will you be my valentine? ( ﾟ □ ﾟ ) !!</h1>
        
        <div class="buttons">
            <button id="yes-btn" onclick="sayYes()">Yes</button>
            <button id="no-btn" onclick="sayNo()">No</button>
        </div>
    </div>

    <script>
        const noMessages = [
            "Are you sure?",
            "Pretty please",
            "With a chocolate rice cake on top",
            "PLEASE POOKIE",
            "I am going to die",
            "please babe",
            "PRETTY PLEASE",
            "No :("
        ];

        let noClickCount = 0;
        let yesButtonSize = 1.2; 
        let yesButtonPadding = 10; 

        function sayNo() {
            const noButton = document.getElementById('no-btn');
            const yesButton = document.getElementById('yes-btn');
            
            if (noClickCount < noMessages.length) {
                noButton.innerText = noMessages[noClickCount];
            } else {
                noButton.innerText = noMessages[noMessages.length - 1]; 
            }
            
            yesButtonSize += 1.8; 
            yesButtonPadding += 15;
            
            yesButton.style.fontSize = `${yesButtonSize}rem`;
            yesButton.style.padding = `${yesButtonPadding}px ${yesButtonPadding * 2}px`;
            
            noClickCount++;
        }

        function sayYes() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="gif-container">
                    <!-- Fetching the exact Happy GIF via an unblocked API proxy -->
                    <img src="https://api.codetabs.com/v1/proxy?quest=https://media.tenor.com/7bEeblH2d-0AAAAi/milk-and-mocha-bear-couple.gif" alt="Happy Milk and Mocha">
                </div>
                <h1 style="color: #333; font-size: 2.5rem; margin-top: 20px; font-weight: bold;">YAYYY!!!! ♡</h1>
            `;
        }
    </script>
</body>
</html>
